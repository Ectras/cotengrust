# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # # delegate to `maturin generate-ci github > .github/workflows/CI.yml`
  # # Enable Dependabot for GitHub Actions
  # - package-ecosystem: "github-actions"
  #   directory: "/"  # Location of your workflows, typically the root folder
  #   schedule:
  #     interval: "monthly"  # Frequency of update checks (daily, weekly, or monthly)
  #   cooldown:
  #     default-days: 7
  #   groups:
  #     github-actions:
  #       patterns:
  #         - "*"

  # Enable Dependabot for Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"  # Location of your Cargo.toml file, typically the root folder
    schedule:
      interval: "monthly"  # Frequency of update checks (daily, weekly, or monthly)
    cooldown:
      default-days: 7
